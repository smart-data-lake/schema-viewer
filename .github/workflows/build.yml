# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run the tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build

# pushes are only built for the integration branch, everything else is built through its pull request,
# so that a change is not built twice
on:
  push:
    branches:
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 24.x
      uses: actions/setup-node@v3
      with:
        node-version: 24.x
        cache: 'yarn'
    - run: yarn install --frozen-lockfile
    - run: yarn lint
    - run: yarn build
    - run: yarn test

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 24.x
      uses: actions/setup-node@v3
      with:
        node-version: 24.x
        cache: 'yarn'
    - run: yarn install --frozen-lockfile
    - run: npx playwright install --with-deps chromium
    - run: yarn test:e2e
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
